<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PatoDev — Software Engineer</title>
  <desc id="desc">Dark hero with cyan, yellow, and red light strokes inspired by patodev.com.</desc>
  <rect width="1200" height="420" fill="#000000"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="44%" r="66%">
      <stop offset="0" stop-color="#06151a" stop-opacity="0.92"/>
      <stop offset="0.54" stop-color="#020507" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="lineGlow" x="-20%" y="-35%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="tightGlow"/>
      <feGaussianBlur stdDeviation="18" result="wideGlow"/>
      <feMerge><feMergeNode in="wideGlow"/><feMergeNode in="tightGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warmGlow" x="-20%" y="-35%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="tightGlow"/>
      <feGaussianBlur stdDeviation="13" result="wideGlow"/>
      <feMerge><feMergeNode in="wideGlow"/><feMergeNode in="tightGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamBlur" x="-25%" y="-35%" width="150%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="cyanBeam" x1="-90" y1="214" x2="860" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08e7ff" stop-opacity="0.44"/><stop offset="0.18" stop-color="#08e7ff" stop-opacity="0.28"/><stop offset="0.55" stop-color="#00c7ed" stop-opacity="0.12"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="-70" y1="216" x2="860" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ffff"/><stop offset="0.18" stop-color="#27e9ff"/><stop offset="0.62" stop-color="#00bce2" stop-opacity="0.75"/><stop offset="1" stop-color="#00607f" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="yellowCore" x1="610" y1="342" x2="1210" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/><stop offset="0.22" stop-color="#ffbd00" stop-opacity="0.18"/><stop offset="0.58" stop-color="#ffe028" stop-opacity="0.76"/><stop offset="1" stop-color="#fff0a8"/>
    </linearGradient>
    <linearGradient id="yellowBeam" x1="610" y1="342" x2="1210" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/><stop offset="0.32" stop-color="#ffb400" stop-opacity="0.06"/><stop offset="0.72" stop-color="#ffc400" stop-opacity="0.22"/><stop offset="1" stop-color="#ffb400" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="redCore" x1="432" y1="382" x2="1210" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/><stop offset="0.3" stop-color="#ff321f" stop-opacity="0.08"/><stop offset="0.62" stop-color="#ff4b2c" stop-opacity="0.36"/><stop offset="1" stop-color="#ff9a82"/>
    </linearGradient>
    <linearGradient id="redBeam" x1="432" y1="382" x2="1210" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/><stop offset="0.36" stop-color="#ff2d1c" stop-opacity="0.04"/><stop offset="0.72" stop-color="#ff3b22" stop-opacity="0.18"/><stop offset="1" stop-color="#ff2b1b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="titleText" x1="184" y1="118" x2="1018" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8feff"/><stop offset="0.45" stop-color="#08d7f2"/><stop offset="0.74" stop-color="#ffe454"/><stop offset="1" stop-color="#ff7657"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#vignette)"/>
  <g opacity="0.42">
    <path d="M100 74H1100M100 346H1100" stroke="#143240" stroke-width="1" stroke-dasharray="2 16"/>
    <path d="M180 48V372M1020 48V372" stroke="#143240" stroke-width="1" stroke-dasharray="2 16"/>
  </g>
  <g style="mix-blend-mode:screen">
    <path d="M -96 214 C 110 258 350 324 548 326 C 676 328 770 292 866 252 L 866 282 C 748 330 642 350 520 342 C 306 328 104 280 -96 236 Z" fill="url(#cyanBeam)" filter="url(#beamBlur)" opacity="0.98"/>
    <path d="M -72 218 C 146 268 350 326 548 330 C 668 332 764 296 858 254" stroke="url(#cyanCore)" stroke-width="4.2" stroke-linecap="round" filter="url(#lineGlow)"/>
    <path d="M -66 217 C 148 269 348 326 548 330 C 668 332 764 296 858 254" stroke="#d8ffff" stroke-width="0.9" stroke-linecap="round" opacity="0.72"/>
    <path d="M 606 344 C 752 320 842 246 958 188 C 1070 132 1158 104 1210 92" stroke="url(#yellowBeam)" stroke-width="34" stroke-linecap="round" filter="url(#beamBlur)" opacity="0.8"/>
    <path d="M 606 344 C 752 320 842 246 958 188 C 1070 132 1158 104 1210 92" stroke="url(#yellowCore)" stroke-width="5" stroke-linecap="round" filter="url(#warmGlow)"/>
    <path d="M 432 382 C 622 348 744 318 884 318 C 1016 318 1110 340 1216 346" stroke="url(#redBeam)" stroke-width="44" stroke-linecap="round" filter="url(#beamBlur)" opacity="0.74"/>
    <path d="M 432 382 C 622 348 744 318 884 318 C 1016 318 1110 340 1216 346" stroke="url(#redCore)" stroke-width="6" stroke-linecap="round" filter="url(#warmGlow)"/>
  </g>
  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="169" fill="url(#titleText)" font-size="72" font-weight="900" letter-spacing="-3">PatoDev</text>
    <text x="600" y="216" fill="#eaf7ff" font-size="24" font-weight="700" letter-spacing="4">SOFTWARE ENGINEER · JUNIOR FULL-STACK</text>
    <text x="600" y="270" fill="#ffe454" font-size="15" font-weight="700" letter-spacing="2">One step at a time.</text>
  </g>
</svg>
